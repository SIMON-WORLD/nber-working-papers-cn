name: Scheduled Agent Check-in

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-agent-checkin
  cancel-in-progress: false

jobs:
  check-in:
    if: vars.AGENT_CHECKIN_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      AGENT_CHECKIN_AUTHORS: ${{ vars.AGENT_CHECKIN_AUTHORS }}
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Append transparent check-in record
        shell: bash
        run: |
          set -euo pipefail

          today="$(date +%F)"
          now="$(date '+%F %T %Z')"
          log_file="activity/agent-checkins.csv"
          mkdir -p activity

          if [ ! -f "$log_file" ]; then
            printf 'date,timestamp,note,agents\n' > "$log_file"
          fi

          if grep -q "^${today}," "$log_file"; then
            echo "Agent check-in already recorded for ${today}."
            exit 0
          fi

          authors="${AGENT_CHECKIN_AUTHORS:-Codex <noreply@openai.com>;Claude <noreply@anthropic.com>}"
          author_names=""
          trailer_file="$(mktemp)"
          trap 'rm -f "$trailer_file"' EXIT

          IFS=';' read -r -a author_list <<< "$authors"
          if [ "${#author_list[@]}" -eq 0 ]; then
            echo "::error::AGENT_CHECKIN_AUTHORS is empty."
            exit 1
          fi

          for author in "${author_list[@]}"; do
            author="$(echo "$author" | sed 's/^ *//;s/ *$//')"
            if ! printf '%s\n' "$author" | grep -Eq '^[A-Za-z0-9._-]+ <[^[:space:]<>]+@[^[:space:]<>]+>$'; then
              echo "::error::Invalid agent identity format: $author"
              exit 1
            fi
            printf 'Co-Authored-By: %s\n' "$author" >> "$trailer_file"
            if [ -n "$author_names" ]; then
              author_names="$author_names; "
            fi
            author_names="$author_names$author"
          done

          printf '%s,%s,automated scheduled agent check-in (no substantive code change),"%s"\n' \
            "$today" "$now" "$author_names" >> "$log_file"

          # Empty repository variables must not override the safe bot identity.
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          {
            printf 'chore: scheduled agent check-in %s\n\n' "$today"
            printf 'Automated attribution record; no substantive code change.\n\n'
            cat "$trailer_file"
          } > commit-message.txt

          git add "$log_file"
          git commit -F commit-message.txt
          git push
